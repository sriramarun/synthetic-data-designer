[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd"
version = "0.1.0"
description = "Spec-driven synthetic data designer for structured finance loan tapes and panels"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sriram Krishnan" }]
keywords = ["synthetic-data", "structured-finance", "securitisation", "esma", "abs", "rmbs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "duckdb>=0.10",
    "typer>=0.12",
]

[project.optional-dependencies]
# NVIDIA NeMo Data Designer sampling backend (upstream deeploans lineage).
nemo = ["data-designer>=0.6.0"]
# Deep-generative polish step (CTGAN / TVAE via SDV).
deep = ["sdv>=1.17"]
# Local web UI: upload a tape, edit the spec, run it, inspect the result.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # The web tests drive the app through fastapi's TestClient, which needs httpx.
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
sdd = "sdd.cli:app"

[project.urls]
Homepage = "https://github.com/sriramarun/synthetic-data-designer"
Issues = "https://github.com/sriramarun/synthetic-data-designer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "sdd/packs"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # typer uses function calls in argument defaults by design
    "RUF012",  # mutable class attrs; pydantic models handle this themselves
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that generate large datasets (deselect with '-m \"not slow\"')",
    "upstream: tests that require the upstream deeploans checkout + data-designer",
]
